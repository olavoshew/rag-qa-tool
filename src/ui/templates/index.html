<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>RAG Document Q&A</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', system-ui, sans-serif;
            max-width: 640px;
            margin: 0 auto;
            padding: 3rem 1.25rem 4rem;
            color: #EDEDEF;
            background: #020203;
            -webkit-font-smoothing: antialiased;
        }

        header {
            margin-bottom: 2.5rem;
        }

        header h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            font-size: 1.5rem;
            letter-spacing: -0.02em;
            color: #EDEDEF;
            margin-bottom: 0.4rem;
        }

        header p {
            font-size: 0.9rem;
            color: #8A8F98;
            line-height: 1.5;
        }

        header .separator {
            display: block;
            width: 24px;
            height: 2px;
            background: #5E6AD2;
            margin-top: 1rem;
            border-radius: 1px;
        }

        h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 500;
            font-size: 1rem;
            letter-spacing: -0.01em;
            color: #EDEDEF;
            margin-bottom: 0.75rem;
        }

        section {
            margin-bottom: 1.75rem;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            background: #0a0a0c;
            transition: border-color 150ms ease-out;
        }

        section:hover {
            border-color: rgba(255, 255, 255, 0.14);
        }

        input[type="file"],
        input[type="text"] {
            display: block;
            width: 100%;
            padding: 0.6rem 0.75rem;
            margin-bottom: 0.75rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            background: #111114;
            color: #EDEDEF;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 150ms ease-out, box-shadow 150ms ease-out;
        }

        input[type="file"]::file-selector-button {
            font-family: 'DM Sans', sans-serif;
            font-size: 0.85rem;
            padding: 0.35rem 0.75rem;
            margin-right: 0.75rem;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 4px;
            background: #1a1a1f;
            color: #EDEDEF;
            cursor: pointer;
            transition: background 150ms ease-out;
        }

        input[type="file"]::file-selector-button:hover {
            background: #242430;
        }

        input[type="text"]::placeholder {
            color: #555;
        }

        input[type="text"]:focus,
        input[type="file"]:focus {
            border-color: #5E6AD2;
            box-shadow: 0 0 0 3px rgba(94, 106, 210, 0.15);
        }

        .form-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        button {
            padding: 0.55rem 1.25rem;
            background: #5E6AD2;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            font-weight: 500;
            font-size: 0.9rem;
            transition: background 150ms ease-out, transform 150ms ease-out;
            flex-shrink: 0;
        }

        button:hover {
            background: #6E7CE0;
            transform: scale(1.02);
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background: #2a2a3a;
            color: #666;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            margin-top: 0.75rem;
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .status.success {
            background: rgba(48, 164, 108, 0.1);
            color: #30A46C;
            border: 1px solid rgba(48, 164, 108, 0.15);
        }

        .status.error {
            background: rgba(229, 72, 77, 0.1);
            color: #E5484D;
            border: 1px solid rgba(229, 72, 77, 0.15);
        }

        #answer-box {
            margin-top: 1rem;
            padding: 1rem 1rem 1rem 1.25rem;
            background: #0a0a0c;
            border-left: 2px solid #5E6AD2;
            border-radius: 0 6px 6px 0;
            opacity: 0;
            transform: translateY(4px);
            transition: opacity 200ms ease-out, transform 200ms ease-out;
        }

        #answer-box.visible {
            opacity: 1;
            transform: translateY(0);
        }

        #answer-text {
            white-space: pre-wrap;
            line-height: 1.7;
            margin-bottom: 0.75rem;
            color: #EDEDEF;
        }

        .sources {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem;
            color: #8A8F98;
        }

        .sources span {
            display: inline-block;
            background: rgba(94, 106, 210, 0.1);
            color: #8B95E0;
            padding: 0.2rem 0.55rem;
            border-radius: 4px;
            margin: 0.2rem 0.3rem 0.2rem 0;
            border: 1px solid rgba(94, 106, 210, 0.15);
        }

        .hint {
            font-size: 0.8rem;
            color: #555;
            margin-bottom: 0.75rem;
            line-height: 1.5;
        }

        .hint strong {
            color: #8A8F98;
            font-weight: 500;
        }

        .examples {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-bottom: 0.75rem;
        }

        .example-chip {
            font-family: 'DM Sans', sans-serif;
            font-size: 0.8rem;
            padding: 0.3rem 0.65rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            background: transparent;
            color: #8A8F98;
            cursor: pointer;
            transition: border-color 150ms ease-out, color 150ms ease-out;
        }

        .example-chip:hover {
            border-color: rgba(94, 106, 210, 0.4);
            color: #EDEDEF;
            background: transparent;
            transform: none;
        }

        .spinner {
            display: none;
            margin-left: 0.25rem;
        }

        .spinner::after {
            content: "";
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(94, 106, 210, 0.3);
            border-top-color: #5E6AD2;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <header>
        <h1>RAG Document Q&A</h1>
        <p>Upload PDFs. Ask questions. Get cited answers.</p>
        <span class="separator"></span>
    </header>

    <section>
        <h2>Upload PDF</h2>
        <form id="upload-form">
            <input type="file" id="pdf-file" accept=".pdf" required>
            <div class="form-row">
                <button type="submit" id="upload-btn">Upload</button>
                <span class="spinner" id="upload-spinner"></span>
            </div>
        </form>
        <div id="upload-status"></div>
    </section>

    <section>
        <h2>Ask a Question</h2>
        <p class="hint"><strong>Specific questions work best.</strong> Ask about a named topic, term, finding, or person in the document rather than something open-ended like "what is this about?"</p>
        <div class="examples" id="examples"></div>
        <form id="ask-form">
            <input type="text" id="question" placeholder="e.g. What does the report say about climate risk?" required>
            <div class="form-row">
                <button type="submit" id="ask-btn">Ask</button>
                <span class="spinner" id="ask-spinner"></span>
            </div>
        </form>
        <div id="answer-box">
            <div id="answer-text"></div>
            <div class="sources" id="sources"></div>
        </div>
    </section>

    <script>
        const EXAMPLES = [
            "What are the main conclusions?",
            "Who are the key people mentioned?",
            "What recommendations are made?",
            "What data or statistics are cited?",
            "What problem does this document address?",
        ];

        const examplesEl = document.getElementById("examples");
        EXAMPLES.forEach(text => {
            const chip = document.createElement("button");
            chip.type = "button";
            chip.className = "example-chip";
            chip.textContent = text;
            chip.addEventListener("click", () => {
                document.getElementById("question").value = text;
                document.getElementById("question").focus();
            });
            examplesEl.appendChild(chip);
        });

        const uploadForm = document.getElementById("upload-form");
        const askForm = document.getElementById("ask-form");

        uploadForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const fileInput = document.getElementById("pdf-file");
            const statusDiv = document.getElementById("upload-status");
            const btn = document.getElementById("upload-btn");
            const spinner = document.getElementById("upload-spinner");

            if (!fileInput.files.length) return;

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            btn.disabled = true;
            spinner.style.display = "inline-block";
            statusDiv.innerHTML = "";

            try {
                const res = await fetch("/ingest", { method: "POST", body: formData });
                const data = await res.json();
                if (data.status === "ingested") {
                    statusDiv.innerHTML = `<div class="status success">Ingested ${data.filename} (${data.chunks} chunks)</div>`;
                } else {
                    statusDiv.innerHTML = `<div class="status error">${data.message || "Upload failed"}</div>`;
                }
            } catch (err) {
                statusDiv.innerHTML = `<div class="status error">Error: ${err.message}</div>`;
            } finally {
                btn.disabled = false;
                spinner.style.display = "none";
            }
        });

        askForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const question = document.getElementById("question").value.trim();
            const answerBox = document.getElementById("answer-box");
            const answerText = document.getElementById("answer-text");
            const sourcesDiv = document.getElementById("sources");
            const btn = document.getElementById("ask-btn");
            const spinner = document.getElementById("ask-spinner");

            if (!question) return;

            btn.disabled = true;
            spinner.style.display = "inline-block";
            answerBox.classList.remove("visible");

            try {
                const res = await fetch("/ask", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ question }),
                });
                const data = await res.json();
                answerText.textContent = data.answer;
                sourcesDiv.innerHTML = data.sources.length
                    ? "Sources: " + data.sources.map(s => `<span>${s.source}, p.${s.page}</span>`).join("")
                    : "";
                answerBox.classList.add("visible");
            } catch (err) {
                answerText.textContent = "Error: " + err.message;
                sourcesDiv.innerHTML = "";
                answerBox.classList.add("visible");
            } finally {
                btn.disabled = false;
                spinner.style.display = "none";
            }
        });
    </script>
</body>
</html>
